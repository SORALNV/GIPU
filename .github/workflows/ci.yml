name: ZIP解析・CPU参照経路の検証
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ビルド依存を準備
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build strace zip 7zip zlib1g-dev libdeflate-dev libisal-dev
      - name: 構成とビルド
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGIPU_ENABLE_GPU=OFF -DGIPU_SANITIZE=${{ matrix.sanitize }}
          cmake --build build -j 2
      - name: ZIP互換性と不正入力・出力保護を検証
        run: ctest --test-dir build --output-on-failure
      - name: 並列CPU経路を検証
        run: GIPU_TEST_BACKEND=libdeflate GIPU_TEST_THREADS=4 python3 tests/integration.py build/gipu
  rapidgzip:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fork_isal: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ビルド依存と固定版Rapidgzipを準備
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build nasm zlib1g-dev libdeflate-dev libisal-dev
          bash scripts/bootstrap_rapidgzip.sh --with-isal
      - name: 実験用の単一ストリーム並列経路を検証
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIPU_ENABLE_GPU=OFF -DGIPU_ENABLE_RAPIDGZIP=ON -DGIPU_RAPIDGZIP_ISAL=${{ matrix.fork_isal }} -DRAPIDGZIP_ROOT="$PWD/.deps/rapidgzip/librapidarchive"
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
  minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: zlibだけの最小構成と自動選択のfallbackを検証
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zip zlib1g-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIPU_ENABLE_GPU=OFF -DGIPU_ENABLE_LIBDEFLATE=OFF -DGIPU_ENABLE_ISAL=OFF
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ClangによるCPUビルドと実行
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build zip zlib1g-dev libdeflate-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DGIPU_ENABLE_GPU=OFF -DGIPU_ENABLE_ISAL=OFF
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
  cpu-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ARM64実機のCPU・ツール情報と高速CPU構成を検証
        run: |
          uname -a
          lscpu
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zip 7zip zlib1g-dev libdeflate-dev
          g++ --version
          cmake --version
          python3 --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIPU_ENABLE_GPU=OFF -DGIPU_ENABLE_ISAL=OFF
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
          GIPU_TEST_BACKEND=libdeflate GIPU_TEST_THREADS=4 python3 tests/integration.py build/gipu
