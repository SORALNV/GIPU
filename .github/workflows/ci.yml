name: ZIP解析・CPU参照経路の検証
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ビルド依存を準備
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zlib1g-dev libdeflate-dev libisal-dev
      - name: 構成とビルド
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGIPU_ENABLE_GPU=OFF -DGIPU_SANITIZE=${{ matrix.sanitize }}
          cmake --build build -j 2
      - name: ZIP互換性と不正入力・出力保護を検証
        run: ctest --test-dir build --output-on-failure
      - name: 並列CPU経路を検証
        run: GIPU_TEST_BACKEND=libdeflate GIPU_TEST_THREADS=4 python3 tests/integration.py build/gipu
  rapidgzip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: ビルド依存と固定版Rapidgzipを準備
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zlib1g-dev libdeflate-dev libisal-dev
          bash scripts/bootstrap_rapidgzip.sh
      - name: 実験用の単一ストリーム並列経路を検証
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIPU_ENABLE_GPU=OFF -DGIPU_ENABLE_RAPIDGZIP=ON -DRAPIDGZIP_ROOT="$PWD/.deps/rapidgzip/librapidarchive"
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
